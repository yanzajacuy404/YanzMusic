<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YanzMusic • by YanzExilent</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(0,255,255,0.08) 0%, transparent 80%);
            z-index: -1;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .logo h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.6rem;
            opacity: 0.7;
        }
        .menu-btn {
            background: none;
            border: none;
            color: #00ffff;
            font-size: 26px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .menu-btn:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: rgba(10, 20, 35, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid #00ffff;
            transition: 0.3s ease;
            z-index: 1000;
            padding: 80px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar.open {
            right: 0;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            color: #fff;
            cursor: pointer;
        }
        .menu-item {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-item.active {
            background: linear-gradient(95deg, #00c6ff, #0072ff);
            border-color: #fff;
            box-shadow: 0 0 12px #00c6ff;
        }
        .menu-item i {
            margin-right: 10px;
        }
        /* Main content */
        .main-content {
            flex: 1;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            overflow-y: auto;
        }
        .page {
            display: none;
        }
        .page.active-page {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom Player */
        .custom-player {
            background: rgba(0, 20, 40, 0.7);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        .song-info .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00ffff;
        }
        .song-info .artist {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }
        .controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls button:hover {
            background: #00ffff;
            color: #000;
            transform: scale(1.05);
        }
        .play-pause {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            width: 60px;
            height: 60px;
            font-size: 26px;
        }
        .loop-btn {
            background: rgba(255,255,255,0.1);
        }
        .loop-btn.active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 8px #00ffff;
        }
        .progress-bar {
            background: rgba(255,255,255,0.2);
            height: 6px;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px 0 8px;
        }
        .progress {
            background: linear-gradient(90deg, #00c6ff, #00ffff);
            width: 0%;
            height: 6px;
            border-radius: 10px;
            position: relative;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            opacity: 0.7;
        }
        /* Song list */
        .song-list {
            margin-top: 10px;
            max-height: 280px;
            overflow-y: auto;
        }
        .song-item {
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-item:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateX(5px);
        }
        .song-title {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .song-item i {
            color: #ffd93d;
        }
        /* Loading skeleton */
        .loading-skeleton {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .skeleton-item {
            background: rgba(255,255,255,0.08);
            height: 52px;
            border-radius: 40px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,255,255,0.3);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }
        /* Request form */
        .request-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .request-form input {
            padding: 14px 18px;
            border-radius: 60px;
            border: none;
            background: #1a1f3a;
            color: white;
            font-size: 1rem;
        }
        .btn-wa {
            background: linear-gradient(95deg, #25D366, #128C7E);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 15px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1f3a; }
        ::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 10px; }
    </style>
</head>
<body>
<div class="bg-effect"></div>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>YanzMusic</h1>
            <p>by YanzExilent</p>
        </div>
        <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
    </div>

    <div class="main-content">
        <!-- MUSIK CONTROL page -->
        <div id="musicPage" class="page active-page">
            <div class="custom-player">
                <div class="song-info">
                    <div class="title" id="currentSongTitle">🎵 Pilih lagu</div>
                    <div class="artist" id="currentArtist">YanzMusic</div>
                </div>
                <div class="controls">
                    <button id="prevBtn"><i class="fas fa-backward-step"></i></button>
                    <button id="playPauseBtn" class="play-pause"><i class="fas fa-play"></i></button>
                    <button id="nextBtn"><i class="fas fa-forward-step"></i></button>
                    <button id="loopBtn" class="loop-btn"><i class="fas fa-repeat"></i></button>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div id="songListContainer" class="song-list">
                <div class="loading-text"><div class="spinner"></div> Memuat lagu...</div>
            </div>
        </div>

        <!-- REQUEST page -->
        <div id="requestPage" class="page">
            <div class="request-form">
                <h3 style="text-align:center;"><i class="fab fa-whatsapp"></i> Request Lagu</h3>
                <input type="text" id="reqTitle" placeholder="Judul lagu...">
                <input type="text" id="reqArtist" placeholder="Artis (opsional)">
                <button id="sendWaBtn" class="btn-wa">
                    <i class="fab fa-whatsapp"></i> Kirim ke WhatsApp
                </button>
            </div>
        </div>
    </div>
    <div class="footer">
        <i class="fas fa-database"></i> Firebase | Auto Replay tersedia
    </div>
</div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <button class="close-btn" id="closeSidebar"><i class="fas fa-times"></i></button>
    <div class="menu-item active" data-page="music">
        <i class="fas fa-music"></i> MUSIK CONTROL
    </div>
    <div class="menu-item" data-page="request">
        <i class="fab fa-whatsapp"></i> REQUEST
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyD6ypmddeE8s77-LoaAJQ5IQnASSurmsuU",
        authDomain: "yanzmusic-6aa62.firebaseapp.com",
        projectId: "yanzmusic-6aa62",
        storageBucket: "yanzmusic-6aa62.firebasestorage.app",
        messagingSenderId: "837496836117",
        appId: "1:837496836117:web:fb5f7fc0561c04879d3e1c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let songs = [];
    let currentIndex = 0;
    let audio = new Audio();
    let isPlaying = false;
    let loopOne = false;  // auto replay (loop 1 lagu)

    // DOM elements
    const songContainer = document.getElementById('songListContainer');
    const currentTitleSpan = document.getElementById('currentSongTitle');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loopBtn = document.getElementById('loopBtn');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function loadSong(index) {
        if (!songs.length) return;
        const song = songs[index];
        currentTitleSpan.innerText = song.title;
        audio.src = song.url;
        audio.load();
        if (isPlaying) {
            audio.play().catch(e => console.log(e));
        }
        updatePlayPauseIcon();
    }

    function playCurrent() {
        audio.play();
        isPlaying = true;
        updatePlayPauseIcon();
    }
    function pauseCurrent() {
        audio.pause();
        isPlaying = false;
        updatePlayPauseIcon();
    }
    function updatePlayPauseIcon() {
        const icon = playPauseBtn.querySelector('i');
        icon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
    }
    function updateLoopIcon() {
        if (loopOne) {
            loopBtn.classList.add('active');
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
        } else {
            loopBtn.classList.remove('active');
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
        }
    }

    // Audio event
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = `${percent}%`;
            currentTimeSpan.innerText = formatTime(audio.currentTime);
        }
    });
    audio.addEventListener('loadedmetadata', () => {
        durationSpan.innerText = formatTime(audio.duration);
    });
    audio.addEventListener('ended', () => {
        if (loopOne) {
            // replay lagu yang sama
            audio.currentTime = 0;
            audio.play();
        } else {
            // next otomatis
            if (songs.length) {
                currentIndex = (currentIndex + 1) % songs.length;
                loadSong(currentIndex);
                playCurrent();
            }
        }
    });

    // Controls
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        if (audio.duration) {
            audio.currentTime = percent * audio.duration;
        }
    });
    playPauseBtn.addEventListener('click', () => {
        if (!songs.length) return;
        if (isPlaying) pauseCurrent();
        else playCurrent();
    });
    prevBtn.addEventListener('click', () => {
        if (!songs.length) return;
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        loadSong(currentIndex);
        playCurrent();
    });
    nextBtn.addEventListener('click', () => {
        if (!songs.length) return;
        currentIndex = (currentIndex + 1) % songs.length;
        loadSong(currentIndex);
        playCurrent();
    });
    loopBtn.addEventListener('click', () => {
        loopOne = !loopOne;
        updateLoopIcon();
    });

    // Render daftar lagu dengan loading skeleton
    function renderSongList(loading = false) {
        if (loading) {
            songContainer.innerHTML = `
                <div class="loading-skeleton">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            `;
            return;
        }
        if (!songs.length) {
            songContainer.innerHTML = '<div style="text-align:center; padding:20px;">🎵 Belum ada lagu. Tambah via bot Telegram 🎵</div>';
            return;
        }
        songContainer.innerHTML = songs.map((song, idx) => `
            <div class="song-item" data-index="${idx}">
                <span class="song-title"><i class="fas fa-music"></i> ${escapeHtml(song.title)}</span>
                <i class="fas fa-play-circle"></i>
            </div>
        `).join('');
        document.querySelectorAll('.song-item').forEach(item => {
            item.addEventListener('click', () => {
                const idx = parseInt(item.dataset.index);
                currentIndex = idx;
                loadSong(currentIndex);
                playCurrent();
            });
        });
    }

    // Firebase listener
    let isLoading = true;
    renderSongList(true);
    db.collection("songs").orderBy("createdAt", "asc").onSnapshot(snapshot => {
        songs = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            songs.push({ id: doc.id, title: data.title, url: data.url });
        });
        isLoading = false;
        renderSongList(false);
        if (songs.length && !audio.src) {
            currentIndex = 0;
            loadSong(0);
        }
    }, error => {
        console.error(error);
        songContainer.innerHTML = '<div style="color:#ff6b6b; text-align:center;">Gagal memuat lagu.</div>';
    });

    // Sidebar logic
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const closeSidebar = document.getElementById('closeSidebar');
    menuToggle.addEventListener('click', () => sidebar.classList.add('open'));
    closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));
    document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !menuToggle.contains(e.target) && sidebar.classList.contains('open'))
            sidebar.classList.remove('open');
    });

    const musicPage = document.getElementById('musicPage');
    const requestPage = document.getElementById('requestPage');
    const menuItems = document.querySelectorAll('.menu-item');
    menuItems.forEach(item => {
        item.addEventListener('click', () => {
            const page = item.dataset.page;
            menuItems.forEach(mi => mi.classList.remove('active'));
            item.classList.add('active');
            if (page === 'music') {
                musicPage.classList.add('active-page');
                requestPage.classList.remove('active-page');
            } else {
                requestPage.classList.add('active-page');
                musicPage.classList.remove('active-page');
            }
            sidebar.classList.remove('open');
        });
    });

    // Request WhatsApp
    document.getElementById('sendWaBtn').addEventListener('click', () => {
        const title = document.getElementById('reqTitle').value.trim();
        const artist = document.getElementById('reqArtist').value.trim();
        if (!title) {
            alert('Masukkan judul lagu!');
            return;
        }
        let msg = `Halo YanzExilent, saya mau request lagu: ${title}`;
        if (artist) msg += ` (artis: ${artist})`;
        window.open(`https://wa.me/6285784009298?text=${encodeURIComponent(msg)}`, '_blank');
    });
</script>
</body>
</html>
